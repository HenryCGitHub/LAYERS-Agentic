name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install & check Cloud Functions + proxy & hook tests
        run: |
          npm --prefix functions ci --no-audit --no-fund
          node --check functions/index.js
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/cloud_proxy_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/workflow_hook_test.py

      - name: Run static analysis
        run: |
          set -o pipefail
          dart analyze 2>&1 | tee analyze_output.log || {
            grep -E "error -|warning -|info -" analyze_output.log | head -n 9 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Run unit & widget tests
        run: |
          set -o pipefail
          flutter test --reporter compact 2>&1 | tee test_output.log || {
            grep -E "EXCEPTION CAUGHT BY|The following .* was thrown|A RenderFlex overflowed|Expected:|Actual:|-\s+[0-9]+:.*\[E\]|workbench_flow_test\.dart:[0-9]+" test_output.log | head -n 9 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
