name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: |
          set -o pipefail
          dart analyze 2>&1 | tee analyze_output.log || {
            grep -E "error -|warning -|info -" analyze_output.log | head -n 9 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Run unit & widget tests
        run: |
          set -o pipefail
          flutter test --reporter compact 2>&1 | tee test_output.log || {
            grep -E "EXCEPTION CAUGHT BY|The following .* was thrown|A RenderFlex overflowed|Expected:|Actual:|-\s+[0-9]+:.*\[E\]|workbench_flow_test\.dart:[0-9]+" test_output.log | head -n 9 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Build Flutter Web (Release)
        run: |
          echo "Building clean public web bundle (users enter API key locally in AI Settings)."
          flutter build web --release --base-href "/LAYERS-Agentic/"
          touch build/web/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
          commit_message: "Deploy LAYERS Web App (${{ github.sha }})"
